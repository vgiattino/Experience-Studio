<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"></stop>
      <stop offset="0.5" stop-color="#555"></stop>
      <stop offset="1" stop-color="#2c2c2c"></stop>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e9e9e"></stop>
      <stop offset="0.5" stop-color="#cfcfcf"></stop>
      <stop offset="1" stop-color="#9e9e9e"></stop>
    </linearGradient>
    <linearGradient id="magentaStreak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e91e63"></stop>
      <stop offset="0.5" stop-color="#c2185b"></stop>
      <stop offset="1" stop-color="#880e4f"></stop>
    </linearGradient>
    <linearGradient id="orangeStreak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7043"></stop>
      <stop offset="1" stop-color="#d84315"></stop>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"></feGaussianBlur></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
    <pattern id="treeNoise" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4a4a4a"></rect>
      <circle cx="8" cy="10" r="6" fill="#3a3a3a"></circle>
      <circle cx="22" cy="18" r="7" fill="#535353"></circle>
      <circle cx="32" cy="6" r="5" fill="#404040"></circle>
      <circle cx="14" cy="30" r="6" fill="#444"></circle>
      <circle cx="30" cy="32" r="7" fill="#3d3d3d"></circle>
      <circle cx="38" cy="22" r="4" fill="#4d4d4d"></circle>
    </pattern>
  </defs>
  
  
  <rect width="800" height="1100" fill="url(#treeNoise)"></rect>
  
  
  <rect width="800" height="1100" fill="url(#sky)" opacity="0.5"></rect>
  
  
  <g transform="rotate(28 400 550)">
    <path d="M -200 400 Q 200 380, 400 420 T 1100 460" stroke="url(#road)" stroke-width="110" fill="none" opacity="0.85"></path>
    <path d="M -200 400 Q 200 380, 400 420 T 1100 460" stroke="#bdbdbd" stroke-width="2" fill="none" opacity="0.4"></path>
    
    <path d="M -200 400 Q 200 380, 400 420 T 1100 460" stroke="#fafafa" stroke-width="1.2" stroke-dasharray="14 18" fill="none" opacity="0.7"></path>
  </g>
  
  
  <g transform="rotate(58 400 550)">
    <path d="M -200 580 Q 200 560, 400 600 T 1100 640" stroke="url(#road)" stroke-width="100" fill="none" opacity="0.85"></path>
    <path d="M -200 580 Q 200 560, 400 600 T 1100 640" stroke="#fafafa" stroke-width="1.2" stroke-dasharray="14 18" fill="none" opacity="0.7"></path>
  </g>
  
  
  <g transform="rotate(78 400 550)">
    <path d="M -200 750 Q 200 720, 400 760 T 1100 790" stroke="url(#road)" stroke-width="80" fill="none" opacity="0.8"></path>
    <path d="M -200 750 Q 200 720, 400 760 T 1100 790" stroke="#fafafa" stroke-width="1.2" stroke-dasharray="14 18" fill="none" opacity="0.6"></path>
  </g>
  
  
  <g transform="rotate(28 400 550)">
    <path d="M -100 380 Q 200 360, 400 400 T 1000 440" stroke="url(#magentaStreak)" stroke-width="48" fill="none" filter="url(#blur8)" opacity="0.9"></path>
    <path d="M -100 380 Q 200 360, 400 400 T 1000 440" stroke="#e91e63" stroke-width="22" fill="none" filter="url(#blur3)" opacity="0.95"></path>
    <path d="M -100 380 Q 200 360, 400 400 T 1000 440" stroke="#ff4081" stroke-width="8" fill="none" filter="url(#blur1)"></path>
    <path d="M -100 380 Q 200 360, 400 400 T 1000 440" stroke="#fff5fa" stroke-width="2" fill="none" opacity="0.9"></path>
  </g>
  
  
  <g transform="rotate(28 400 550)">
    <path d="M -100 320 Q 100 305, 300 330 T 700 360" stroke="url(#orangeStreak)" stroke-width="36" fill="none" filter="url(#blur8)" opacity="0.85"></path>
    <path d="M -100 320 Q 100 305, 300 330 T 700 360" stroke="#ff5722" stroke-width="14" fill="none" filter="url(#blur3)" opacity="0.95"></path>
    <path d="M -100 320 Q 100 305, 300 330 T 700 360" stroke="#ffb74d" stroke-width="4" fill="none" filter="url(#blur1)"></path>
    <path d="M -100 320 Q 100 305, 300 330 T 700 360" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.85"></path>
  </g>
  
  
  <g fill="#fff" opacity="0.8" filter="url(#blur1)">
    <circle cx="180" cy="850" r="2"></circle><circle cx="220" cy="840" r="2"></circle><circle cx="320" cy="820" r="2"></circle>
    <circle cx="540" cy="760" r="2"></circle><circle cx="600" cy="730" r="2"></circle>
    <circle cx="120" cy="280" r="2"></circle><circle cx="160" cy="260" r="2"></circle><circle cx="220" cy="240" r="2"></circle>
  </g>
  
  
  <g fill="#2a2a2a" opacity="0.95">
    <rect x="0" y="0" width="320" height="120" fill="#1f1f1f"></rect>
    <rect x="220" y="40" width="100" height="80" fill="#2a2a2a"></rect>
    <rect x="600" y="0" width="200" height="100" fill="#1f1f1f"></rect>
    <rect x="640" y="60" width="160" height="40" fill="#272727"></rect>
  </g>
  
  
  <g fill="#3a3a3a">
    <rect x="280" y="860" width="180" height="80" rx="2"></rect>
    <rect x="290" y="870" width="40" height="60" fill="#525252"></rect>
    <rect x="340" y="875" width="40" height="55" fill="#4a4a4a"></rect>
  </g>
  
  
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
    <stop offset="0.5" stop-color="rgba(0,0,0,0)"></stop>
    <stop offset="1" stop-color="rgba(0,0,0,0.45)"></stop>
  </radialGradient>
  <rect width="800" height="1100" fill="url(#vig)"></rect>
</svg>